name: Desktop 1.5 Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'build-config/**'
      - 'scripts/release/**'
      - 'src/main/**'
      - 'src/common/constants.ts'
      - 'src/common/cerumusic.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'LICENSE'
      - 'NOTICE'

permissions:
  contents: read

concurrency:
  group: desktop-1-5-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_CI: 'true'

jobs:
  source-gate:
    name: Shared source gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm release:test && pnpm release:audit
      - run: pnpm lint && pnpm test:run && pnpm build
      - name: Verify portable environment survives production compilation
        run: |
          node -e "const s=require('fs').readFileSync('dist/main.js','utf8'); if (!s.includes('PORTABLE_EXECUTABLE_DIR') || s.includes('({\"NODE_ENV\":\"production\"}).PORTABLE_EXECUTABLE_DIR')) process.exit(1)"
      - name: Ensure build did not rewrite tracked files
        run: git diff --exit-code

  windows-candidate:
    name: Windows x64 candidate build
    needs: source-gate
    runs-on: windows-2025
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm release:audit
      - name: Build Setup and portable packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts/release | Out-Null
          pnpm pack:win:setup:x64
          Copy-Item build/z-music-desktop-v1.5.0-x64-Setup.exe .artifacts/release/
          pnpm pack:win:portable:x64
          Copy-Item build/z-music-desktop-v1.5.0-x64-portable.exe .artifacts/release/
      - name: Verify package contents and tracked files
        shell: pwsh
        run: |
          $unpacked = 'build/win-unpacked/resources'
          if (-not (Test-Path "$unpacked/LICENSE")) { throw 'LICENSE missing from package' }
          if (-not (Test-Path "$unpacked/NOTICE")) { throw 'NOTICE missing from package' }
          git diff --exit-code
      - name: Write candidate manifest and SHA-256
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/release/write-manifest.mjs $env:CANDIDATE_SHA .artifacts/release/release-manifest.json .artifacts/release/z-music-desktop-v1.5.0-x64-Setup.exe .artifacts/release/z-music-desktop-v1.5.0-x64-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: z-music-desktop-v1.5.0-windows-x64
          path: .artifacts/release/**
          if-no-files-found: error
          retention-days: 14

  windows-client-acceptance:
    name: Windows ${{ matrix.windowsMajor }} x64 acceptance
    needs: windows-candidate
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - windowsMajor: '10'
            runnerLabel: windows-10
            evidence: windows-10-acceptance.json
          - windowsMajor: '11'
            runnerLabel: windows-11
            evidence: windows-11-acceptance.json
    runs-on: [self-hosted, Windows, X64, '${{ matrix.runnerLabel }}']
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: z-music-desktop-v1.5.0-windows-x64
          path: build
      - name: Download historical 1.4.5 x64 Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/zxbdzh/z-music-desktop-legacy-fork/releases/download/v1.4.5/ikun-music-desktop-v1.4.5-x64-Setup.exe' -OutFile build/ikun-music-desktop-v1.4.5-x64-Setup.exe
          $actual = (Get-FileHash build/ikun-music-desktop-v1.4.5-x64-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'e66008435cadb42b5a98b41f76a340dd955d08f696bbf1e47226a797a41fcc0e') { throw 'Historical Setup SHA-256 mismatch' }
      - name: Verify candidate artifact hashes
        shell: pwsh
        run: |
          Get-Content build/SHA256SUMS.txt | ForEach-Object {
            $parts = $_ -split '\s+', 2
            $actual = (Get-FileHash (Join-Path build $parts[1]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0]) { throw "SHA-256 mismatch for $($parts[1])" }
          }
      - name: Run Windows client acceptance
        shell: pwsh
        run: ./scripts/release/windows-acceptance.ps1 -LegacySetup build/ikun-music-desktop-v1.4.5-x64-Setup.exe -Setup build/z-music-desktop-v1.5.0-x64-Setup.exe -Portable build/z-music-desktop-v1.5.0-x64-portable.exe -Commit '${{ github.sha }}' -ExpectedWindowsMajor '${{ matrix.windowsMajor }}' -RcManifest docs/qa/evidence/desktop-rc.manifest.json -Output 'build/${{ matrix.evidence }}'
      - uses: actions/upload-artifact@v4
        with:
          name: z-music-desktop-v1.5.0-windows-${{ matrix.windowsMajor }}-evidence
          path: build/${{ matrix.evidence }}
          if-no-files-found: error
          retention-days: 14

  best-effort-build:
    name: Best effort ${{ matrix.name }}
    needs: source-gate
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            os: macos-15-intel
            command: pnpm build && (pnpm pack:mac:dmg || (hdiutil detach /Volumes/z-music-desktop -force || true; pnpm pack:mac:dmg))
            forceNativeRebuild: '0'
            skipNativeRebuild: 'false'
          - name: macOS arm64
            os: macos-15
            command: pnpm build && pnpm pack:mac:dmg:arm64
            forceNativeRebuild: '0'
            skipNativeRebuild: 'false'
          - name: Linux x64
            os: ubuntu-latest
            command: pnpm build && pnpm exec electron-rebuild -f -o better-sqlite3 && pnpm pack:linux:appImage
            forceNativeRebuild: '1'
            skipNativeRebuild: 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm release:audit
      - name: Install Linux native build dependencies
        if: matrix.name == 'Linux x64'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev
      - run: ${{ matrix.command }}
        env:
          FORCE: ${{ matrix.forceNativeRebuild }}
          Z_MUSIC_SKIP_NATIVE_REBUILD: ${{ matrix.skipNativeRebuild }}
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: z-music-desktop-v1.5.0-${{ matrix.name }}
          path: build/*
          if-no-files-found: error
          retention-days: 7
