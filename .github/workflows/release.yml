name: Build Candidate

on:
  workflow_dispatch:
    inputs:
      configuration_only:
        description: Validate optional notification configuration without building
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  IS_CI: 'true'

jobs:
  notification-configuration:
    name: Optional notification configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.notification.outputs.configured }}
    steps:
      - name: Check PushPlus configuration
        id: notification
        shell: bash
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          if [[ -z "$PUSHPLUS_TOKEN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PushPlus notification skipped because PUSHPLUS_TOKEN is not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  windows-candidate:
    name: Windows unsigned candidate
    needs: notification-configuration
    if: github.ref == 'refs/heads/main' && inputs.configuration_only == false
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out main candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Build desktop source
        run: pnpm build

      - name: Package unsigned Windows x64 candidate
        run: |
          pnpm pack:win:setup:x64
          pnpm pack:win:7z:x64

      - name: Write SHA-256
        shell: pwsh
        run: Get-FileHash build/*.exe,build/*.7z -Algorithm SHA256 | Format-List | Out-File build/SHA256SUMS.txt

      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: z-music-desktop-windows-unsigned-candidate
          path: |
            build/*-x64-Setup.exe
            build/*win_x64-green.7z
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Send optional PushPlus notification
        if: always() && needs.notification-configuration.outputs.configured == 'true'
        shell: pwsh
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          $body = @{
            token = $env:PUSHPLUS_TOKEN
            title = "z-music-desktop candidate build"
            content = "Candidate build status: ${{ job.status }}"
            template = "markdown"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "https://www.pushplus.plus/send" -Method Post -ContentType "application/json" -Body $body
