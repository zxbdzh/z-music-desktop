name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies without packaging rebuilds
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify root lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml

      - name: Check brand assets
        run: pnpm brand:check

      - name: Test lint gate configuration
        run: pnpm lint:test

      - name: Lint first-party source
        run: pnpm lint

      - name: Upload lint quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-quality-report
          path: .artifacts/lint/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Validate QA fixtures and evidence tooling
        run: pnpm qa:evidence

      - name: Render and validate Repository Ready evidence
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/qa/evidence.mjs render \
            docs/qa/evidence/repository-ready.template.json \
            .artifacts/evidence/repository-ready.manifest.json \
            --commit "$CANDIDATE_SHA" \
            --generated-at "$generated_at" \
            --artifact-root lint-quality-report=.artifacts/lint
          node scripts/qa/evidence.mjs validate \
            .artifacts/evidence/repository-ready.manifest.json \
            --artifact-root lint-quality-report=.artifacts/lint
          mkdir -p \
            .artifacts/evidence/docs/qa/schema \
            .artifacts/evidence/docs/qa/fixtures \
            .artifacts/evidence/docs/qa/evidence \
            .artifacts/evidence/artifacts/lint-quality-report
          cp docs/qa/schema/evidence-manifest.v1.schema.json \
            .artifacts/evidence/docs/qa/schema/evidence-manifest.v1.schema.json
          cp -R docs/qa/fixtures/. \
            .artifacts/evidence/docs/qa/fixtures/
          cp docs/qa/evidence/repository-ready-smoke.txt \
            .artifacts/evidence/docs/qa/evidence/repository-ready-smoke.txt
          cp .artifacts/lint/report.json \
            .artifacts/evidence/artifacts/lint-quality-report/report.json
          (
            cd .artifacts/evidence
            sha256sum repository-ready.manifest.json > \
              repository-ready.manifest.json.sha256
          )
          node scripts/qa/evidence.mjs verify-bundle \
            .artifacts/evidence \
            --commit "$CANDIDATE_SHA"

      - name: Upload Repository Ready evidence
        uses: actions/upload-artifact@v4
        with:
          name: repository-ready-evidence
          path: .artifacts/evidence/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build

  android:
    name: Android test and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: apps/android/pnpm-lock.yaml

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"

      - name: Ensure the Linux Gradle wrapper is executable
        run: chmod +x apps/android/android/gradlew

      - name: Install Android dependencies
        run: pnpm android:install

      - name: Verify lockfiles are unchanged
        run: git diff --exit-code -- pnpm-lock.yaml apps/android/pnpm-lock.yaml

      - name: Test Android boundaries and build config
        run: pnpm android:test

      - name: Typecheck Android app
        run: pnpm android:typecheck

      - name: Build and sync Android web assets
        run: pnpm android:sync

      - name: Run Android unit tests
        run: pnpm android:gradle:unit

      - name: Build Android debug APK
        run: pnpm android:gradle:debug

      - name: Scan packaged Android debug APK
        run: |
          mkdir -p apps/android/android/app/build/reports/security
          pnpm android:scan:apk | tee apps/android/android/app/build/reports/security/apk-scan.txt

      - name: Hash Android debug APK
        run: sha256sum apps/android/android/app/build/outputs/apk/debug/app-debug.apk | tee apps/android/android/app/build/reports/security/app-debug.apk.sha256

      - name: Upload Android debug APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: z-music-desktop-android-debug
          path: |
            apps/android/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/android/app/build/reports/**
          if-no-files-found: error
          retention-days: 7
