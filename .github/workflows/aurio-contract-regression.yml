name: AurioClub Contract Regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurio-contract-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-regression:
    name: Optional protected Apifox regression
    if: github.ref == 'refs/heads/main'
    environment: aurio-contract-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check protected regression configuration
        id: configuration
        shell: bash
        env:
          APIFOX_REGRESSION_ENABLED: ${{ vars.APIFOX_REGRESSION_ENABLED }}
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
        run: |
          if [[ "$APIFOX_REGRESSION_ENABLED" != "true" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::External Apifox regression skipped because the protected Environment is disabled."
            exit 0
          fi
          if [[ -z "$APIFOX_ACCESS_TOKEN" ]]; then
            echo "::error::APIFOX_REGRESSION_ENABLED is true but the protected Environment Secret APIFOX_ACCESS_TOKEN is missing."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install Apifox CLI
        if: steps.configuration.outputs.configured == 'true'
        run: npm install --global apifox-cli@2.2.9

      - name: Test contract verifier
        if: steps.configuration.outputs.configured == 'true'
        run: node --test scripts/apifox/aurio-contract-verifier.test.mjs

      - name: Run isolated contract suite
        if: steps.configuration.outputs.configured == 'true'
        env:
          APIFOX_ACCESS_TOKEN: ${{ secrets.APIFOX_ACCESS_TOKEN }}
        run: exec node scripts/apifox/run-aurio-contract-regression.mjs --upload-report
